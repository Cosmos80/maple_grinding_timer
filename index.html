<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple Grinding Timer</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    background-color: #1a1b1e;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    color: #d4d6dc;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #e8eaf0;
    margin: 0;
  }

  .display {
    font-size: 120px;
    font-weight: 700;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 4px;
  }

  .period-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .period-row input {
    width: 90px;
    font-size: 18px;
    text-align: center;
    background: #2a2d3e;
    color: #e8eaf0;
    border: 1px solid #3a3d4a;
    border-radius: 6px;
    padding: 8px 10px;
  }

  .period-row input:focus {
    outline: none;
    border-color: #4f8ef7;
  }

  .continuous-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .continuous-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #4f8ef7;
  }

  .duration-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .duration-row input {
    width: 90px;
    font-size: 18px;
    text-align: center;
    background: #2a2d3e;
    color: #e8eaf0;
    border: 1px solid #3a3d4a;
    border-radius: 6px;
    padding: 8px 10px;
  }

  .duration-row input:focus {
    outline: none;
    border-color: #4f8ef7;
  }

  .duration-row .alarm-remaining {
    font-size: 18px;
    font-weight: 700;
    color: #a5b4fc;
    font-variant-numeric: tabular-nums;
  }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .volume-row input[type="range"] {
    width: 140px;
    accent-color: #4f8ef7;
  }

  .volume-row span {
    width: 36px;
    text-align: right;
    color: #a5b4fc;
    font-variant-numeric: tabular-nums;
  }

  .buttons {
    display: flex;
    gap: 16px;
  }

  button {
    font-size: 16px;
    font-weight: 700;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  input:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #startBtn {
    background: #4f8ef7;
  }

  #restartBtn {
    background: #4f8ef7;
  }

  #pauseBtn {
    background: #3a3d4a;
  }

  #resetBtn {
    background: #3a3d4a;
  }

  .presets {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .presets-label {
    font-size: 14px;
    color: #8b8fa3;
  }

  .preset-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 340px;
  }

  .preset-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    font-size: 14px;
    font-family: inherit;
    padding: 12px 16px;
    border: 1px solid #3a3d4a;
    border-radius: 8px;
    cursor: pointer;
    color: #d4d6dc;
    background: #2a2d3e;
    text-align: left;
  }

  .preset-row:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .preset-name {
    font-weight: 700;
    color: #e8eaf0;
    white-space: nowrap;
  }

  .preset-settings {
    color: #a5b4fc;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Maple Grinding Timer</h1>

  <div class="display" id="display">00:00</div>

  <div class="period-row">
    <label for="periodInput">주기(초)</label>
    <input type="number" id="periodInput" value="55" min="1" step="1">
  </div>

  <div class="continuous-row">
    <label for="continuousToggle">연속모드</label>
    <input type="checkbox" id="continuousToggle">
  </div>

  <div class="duration-row" id="durationRow" style="display:none;">
    <label for="alarmDurationInput">알람 유지 시간(초)</label>
    <input type="number" id="alarmDurationInput" value="5" min="1" step="1">
    <span class="alarm-remaining" id="alarmRemainingDisplay">00:00</span>
  </div>

  <div class="volume-row">
    <label for="volumeInput">알림 볼륨</label>
    <input type="range" id="volumeInput" min="0" max="200" value="90">
    <span id="volumeValue">90%</span>
  </div>

  <div class="buttons">
    <button id="startBtn">실행</button>
    <button id="restartBtn">다시시작</button>
    <button id="pauseBtn" disabled>일시정지</button>
    <button id="resetBtn">리셋</button>
  </div>

  <div class="presets">
    <div class="presets-label">프리셋</div>
    <div class="preset-list">
      <button id="presetSoksaBtn" class="preset-row">
        <span class="preset-name">속사기</span>
        <span class="preset-settings" id="presetSoksaSummary"></span>
      </button>
      <button id="presetLateBtn" class="preset-row">
        <span class="preset-name">레테</span>
        <span class="preset-settings" id="presetLateSummary"></span>
      </button>
    </div>
  </div>

  <audio id="alarmAudio" src="universfield-ringtone-065-496263.mp3" preload="auto" loop></audio>
</div>

<script>
  const DEFAULT_PERIOD = 55;
  const DEFAULT_ALARM_DURATION = 5;

  const display = document.getElementById('display');
  const periodInput = document.getElementById('periodInput');
  const continuousToggle = document.getElementById('continuousToggle');
  const durationRow = document.getElementById('durationRow');
  const alarmDurationInput = document.getElementById('alarmDurationInput');
  const alarmRemainingDisplay = document.getElementById('alarmRemainingDisplay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const volumeInput = document.getElementById('volumeInput');
  const volumeValue = document.getElementById('volumeValue');
  const alarmAudio = document.getElementById('alarmAudio');
  const presetSoksaBtn = document.getElementById('presetSoksaBtn');
  const presetLateBtn = document.getElementById('presetLateBtn');
  const presetButtons = [presetSoksaBtn, presetLateBtn];

  const PRESETS = {
    soksa: { period: 40, continuous: true, alarmDuration: 3, volume: 40 },
    late: { period: 60, continuous: true, alarmDuration: 3, volume: 40 },
  };

  function formatPresetSummary(preset) {
    return `${preset.period}초 · 연속모드 ${preset.continuous ? 'on' : 'off'} · 유지 ${preset.alarmDuration}초 · 볼륨 ${preset.volume}%`;
  }

  document.getElementById('presetSoksaSummary').textContent = formatPresetSummary(PRESETS.soksa);
  document.getElementById('presetLateSummary').textContent = formatPresetSummary(PRESETS.late);

  let remaining = null;
  let countdownId = null;
  let alarmId = null;
  let alarmCountdownId = null;
  let alarmRemaining = null;
  let isPaused = false;
  let audioCtx = null;
  let mp3Source = null;
  let mp3Gain = null;
  let alarmVolume = volumeInput.value / 100;
  let mp3Available = true;

  alarmAudio.volume = 1;
  alarmAudio.addEventListener('error', () => {
    mp3Available = false;
  });

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function updateDisplay() {
    display.textContent = formatTime(remaining ?? 0);
  }

  function updateAlarmRemainingDisplay() {
    alarmRemainingDisplay.textContent = formatTime(alarmRemaining ?? 0);
  }

  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function ensureMp3Graph() {
    ensureAudioCtx();
    if (!mp3Source) {
      mp3Source = audioCtx.createMediaElementSource(alarmAudio);
      mp3Gain = audioCtx.createGain();
      mp3Gain.gain.value = alarmVolume;
      mp3Source.connect(mp3Gain);
      mp3Gain.connect(audioCtx.destination);
    }
  }

  function beep() {
    ensureAudioCtx();
    const now = audioCtx.currentTime;
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.type = 'square';
    oscillator.frequency.value = 660;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.min(Math.max(alarmVolume, 0.0001), 1), now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.5);
  }

  function startBeepFallback() {
    beep();
    alarmId = setInterval(beep, 800);
  }

  function startAlarm() {
    if (!mp3Available) {
      startBeepFallback();
      return;
    }
    try {
      ensureMp3Graph();
      mp3Gain.gain.value = alarmVolume;
      alarmAudio.currentTime = 0;
      const playPromise = alarmAudio.play();
      if (playPromise) {
        playPromise.catch((err) => {
          console.error('mp3 play failed, falling back to beep:', err);
          mp3Available = false;
          startBeepFallback();
        });
      }
    } catch (err) {
      console.error('mp3 setup failed, falling back to beep:', err);
      mp3Available = false;
      startBeepFallback();
    }
  }

  function stopAlarm() {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
    if (alarmId !== null) {
      clearInterval(alarmId);
      alarmId = null;
    }
    if (alarmCountdownId !== null) {
      clearInterval(alarmCountdownId);
      alarmCountdownId = null;
    }
    alarmRemaining = null;
    updateAlarmRemainingDisplay();
  }

  function alarmTick() {
    alarmRemaining -= 1;
    if (alarmRemaining <= 0) {
      alarmRemaining = 0;
      clearInterval(alarmCountdownId);
      alarmCountdownId = null;
      updateAlarmRemainingDisplay();
      handleRestart();
      return;
    }
    updateAlarmRemainingDisplay();
  }

  function tick() {
    remaining -= 1;
    if (remaining <= 0) {
      remaining = 0;
      clearInterval(countdownId);
      countdownId = null;
      startAlarm();
      if (continuousToggle.checked) {
        const duration = parseInt(alarmDurationInput.value, 10);
        alarmRemaining = (Number.isFinite(duration) && duration > 0) ? duration : DEFAULT_ALARM_DURATION;
        updateAlarmRemainingDisplay();
        alarmCountdownId = setInterval(alarmTick, 1000);
      }
    }
    updateDisplay();
  }

  function setPauseUiState(paused) {
    isPaused = paused;
    pauseBtn.textContent = paused ? '일시정지 해제' : '일시정지';
  }

  function setControlsDisabled(disabled) {
    periodInput.disabled = disabled;
    continuousToggle.disabled = disabled;
    alarmDurationInput.disabled = disabled;
    presetButtons.forEach((btn) => { btn.disabled = disabled; });
  }

  function applyPreset(preset) {
    periodInput.value = preset.period;
    continuousToggle.checked = preset.continuous;
    durationRow.style.display = preset.continuous ? 'flex' : 'none';
    alarmDurationInput.value = preset.alarmDuration;
    volumeInput.value = preset.volume;
    volumeInput.dispatchEvent(new Event('input'));
  }

  function beginCountdown() {
    if (remaining === null || remaining <= 0) {
      const period = parseInt(periodInput.value, 10);
      remaining = (Number.isFinite(period) && period > 0) ? period : DEFAULT_PERIOD;
      updateDisplay();
    }
    if (countdownId === null) {
      countdownId = setInterval(tick, 1000);
    }
  }

  function handleStart() {
    stopAlarm();
    beginCountdown();
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    setPauseUiState(false);
    setControlsDisabled(true);
  }

  function handleRestart() {
    stopAlarm();
    if (countdownId !== null) {
      clearInterval(countdownId);
      countdownId = null;
    }
    const period = parseInt(periodInput.value, 10);
    remaining = (Number.isFinite(period) && period > 0) ? period : DEFAULT_PERIOD;
    updateDisplay();
    countdownId = setInterval(tick, 1000);
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    setPauseUiState(false);
    setControlsDisabled(true);
  }

  function handlePauseToggle() {
    if (!isPaused) {
      if (countdownId !== null) {
        clearInterval(countdownId);
        countdownId = null;
      }
      stopAlarm();
      setPauseUiState(true);
    } else {
      stopAlarm();
      beginCountdown();
      setPauseUiState(false);
    }
  }

  function handleReset() {
    if (countdownId !== null) {
      clearInterval(countdownId);
      countdownId = null;
    }
    stopAlarm();
    remaining = null;
    periodInput.value = DEFAULT_PERIOD;
    continuousToggle.checked = false;
    durationRow.style.display = 'none';
    alarmDurationInput.value = DEFAULT_ALARM_DURATION;
    updateDisplay();
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    setPauseUiState(false);
    setControlsDisabled(false);
  }

  continuousToggle.addEventListener('change', () => {
    durationRow.style.display = continuousToggle.checked ? 'flex' : 'none';
  });

  volumeInput.addEventListener('input', () => {
    alarmVolume = volumeInput.value / 100;
    volumeValue.textContent = volumeInput.value + '%';
    if (mp3Gain) {
      mp3Gain.gain.value = alarmVolume;
    }
  });

  startBtn.addEventListener('click', handleStart);
  restartBtn.addEventListener('click', handleRestart);
  pauseBtn.addEventListener('click', handlePauseToggle);
  resetBtn.addEventListener('click', handleReset);
  presetSoksaBtn.addEventListener('click', () => applyPreset(PRESETS.soksa));
  presetLateBtn.addEventListener('click', () => applyPreset(PRESETS.late));

  updateDisplay();
</script>

</body>
</html>
